[project]
name = "skyguard"
version = "0.1.0"
description = "Operator controlled low-latency desktop streaming and AI safety system"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "PySide6-Fluent-Widgets>=1.5",
    "websockets>=12",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "backup",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
